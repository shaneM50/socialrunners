<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Static SEO meta -->
  <title>Social Runners Valencia | Community Runs</title>
  <meta
    name="description"
    content="Social Runners Valencia – an easy-paced running community in Valencia, Spain. Join our regular group runs and meet other runners through our Meetup group."
  >

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://socialrunners.es/">
  <meta property="og:site_name" content="Social Runners Valencia">
  <meta property="og:title" content="Social Runners Valencia | Community Runs">
  <meta
    property="og:description"
    content="Social Runners Valencia – an easy-paced running community in Valencia, Spain. Join our regular group runs and meet other runners through our Meetup group."
  >
  <meta
    property="og:image"
    content="https://socialrunners.es/images/social-runners-share.png"
  >

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Social Runners Valencia | Community Runs">
  <meta
    name="twitter:description"
    content="Social Runners Valencia – an easy-paced running community in Valencia, Spain. Join our regular group runs and meet other runners through our Meetup group."
  >
  <meta
    name="twitter:image"
    content="https://socialrunners.es/images/social-runners-share.png"
  >

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="nav-wrap">
    <div class="nav">
      <div class="brand" data-i18n="nav.brand"></div>

      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
      </button>

      <div class="nav-right">
        <nav class="nav-links" aria-label="Primary">
          <a href="#intro" data-i18n="nav.home"></a>
          <a href="#about" data-i18n="nav.about"></a>
          <a href="#runs" data-i18n="nav.runs"></a>
          <a href="#first5k" data-i18n="nav.first5k"></a>
          <a href="https://socialrunners.wixsite.com/socialrunners/blog"
            target="_blank"
            rel="noopener"
            data-i18n="nav.blog"
          ></a>
          <a href="https://www.meetup.com/valencia-social-runners/"
            target="_blank"
            rel="noopener"
            class="nav-signup"
            data-i18n="nav.signup"></a>
        </nav>

        <div class="lang-toggle" aria-label="Language selector">
          <button data-lang="es" class="lang-btn">ES</button>
          <span class="lang-separator">/</span>
          <button data-lang="en" class="lang-btn active">EN</button>
        </div>
      </div>
    </div>
  </div>

  <main class="page">
    <!-- INTRO -->
    <section id="intro" class="hero">
      <div>
        <h1 data-i18n="hero.title"></h1>
        <p data-i18n="hero.body"></p>
      </div>
    </section>

    <div class="hero-illustration">
      <a
        href="https://www.meetup.com/valencia-social-runners/"
        target="_blank"
        rel="noopener"
      >
        <img
          src="images/social-runners-share.png"
          alt="Social Runners community running together at sunset in Valencia (AI generated)"
        >
      </a>
    </div>


    <!-- ABOUT -->
    <section id="about">
      <div class="section-title">
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.body"></p>
      </div>

      <div class="about-grid">
        <div class="card">
          <h3 data-i18n="about.who.title"></h3>
          <p data-i18n="about.who.body"></p>
        </div>

        <div class="card">
          <h3 data-i18n="about.expect.title"></h3>
          <p data-i18n="about.expect.body"></p>
        </div>
      </div>
      <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>
    </section>

    <!-- GROUP RUNS SECTION -->
    <section id="runs">
      <div class="section-title">
        <h2 data-i18n="runs.title"></h2>
        <p data-i18n="runs.body"></p>
      </div>

      <div class="about-grid">
        <div class="card">
          <h3 data-i18n="runs.how.title"></h3>
          <p data-i18n="runs.how.steps"></p>
          <p style="margin-top:10px;">
            <a href="https://www.meetup.com/valencia-social-runners/"
               target="_blank"
               rel="noopener"
               data-i18n="runs.how.cta"></a>
          </p>
        </div>
      </div>
      <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>
    </section>

      <div class="section-title">
        <h2 data-i18n="first5k.title"></h2>
        <p data-i18n="first5k.subtitle"></p>
      </div>

      <div class="about-grid">
        <div class="card">
          <h3 data-i18n="first5k.who.title"></h3>
          <p data-i18n="first5k.who.body"></p>
        </div>

        <div class="card">
          <h3 data-i18n="first5k.goal.title"></h3>
          <p data-i18n="first5k.goal.body"></p>
        </div>

        <div class="card">
          <h3 data-i18n="first5k.how.title"></h3>
          <p data-i18n="first5k.how.body.part1"></p>
          <p data-i18n="first5k.how.body.part2"></p>

        <div class="card">
          <h3 data-i18n="first5k.included.title"></h3>

        <div class="card">
          <h3 data-i18n="first5k.start.title"></h3>
          <p data-i18n="first5k.start.body"></p>
          <p style="margin-top:10px;">
            <a href="https://www.meetup.com/valencia-social-runners/"
               target="_blank"
               rel="noopener"
               data-i18n="first5k.start.cta"></a>
          </p>
        </div>
      </div>
      <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>

        <h2 data-i18n="blog.title"></h2>
        <p data-i18n="blog.subtitle"></p>

      <p style="text-align:right; font-size:12px; margin:0 0 12px;">
        <a href="https://socialrunners.wixsite.com/socialrunners/blog"
           target="_blank"
           rel="noopener"
           data-i18n="blog.seeMore"></a>
      </p>

      <div class="blog-carousel">
        <button class="blog-nav prev" aria-label="Previous article">‹</button>

        <div class="blog-track">

              <h3>

                  target="_blank"
                  rel="noopener"
                  data-i18n="blog.post1.cta"></a>
              </div>
            </div>
          </article>

          <article class="card blog-card">
            <div class="thumb">
              <a
                href="https://socialrunners.wixsite.com/socialrunners/post/traits-of-a-great-running-coach-runners-should-look-for"
                target="_blank"
                rel="noopener"
              >
                <img
                  src="https://static.wixstatic.com/media/793419_2861080884ae43bfaed8b254112e0e27~mv2.png/v1/fill/w_888,h_508,al_c,lg_1,q_90,enc_avif,quality_auto/793419_2861080884ae43bfaed8b254112e0e27~mv2.png"
                  alt=""
                  data-i18n-alt="blog.post2.imageAlt">
              </a>
            </div>
            <div class="blog-body">
              <div class="meta-row">
                <span class="pill" data-i18n="blog.post2.tag"></span>

                  target="_blank"

            </div>
          </article>

        <button class="blog-nav next" aria-label="Next article">›</button>

      <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>

    <footer>
      <div class="footer-row">
        <span>
          <span data-i18n="footer.copy.prefix"></span>
          <span id="year"></span>
          <span data-i18n="footer.copy.suffix"></span>

        <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>
      </div>
    </footer>

  <script src="locales/es.js"></script>
  <script src="locales/en.js"></script>
