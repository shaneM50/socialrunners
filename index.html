<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Social Runners Valencia | Community Runs</title>
    <meta
      name="description"
      content="Social Runners Valencia — an easy-paced running community in Valencia, Spain. Join our regular group runs and meet other runners through our Meetup group."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://socialrunners.es/" />
    <meta property="og:site_name" content="Social Runners Valencia" />
    <meta property="og:title" content="Social Runners Valencia | Community Runs" />
    <meta
      property="og:description"
      content="Social Runners Valencia — an easy-paced running community in Valencia, Spain. Join our regular group runs and meet other runners through our Meetup group."
    />
    <meta
      property="og:image"
      content="https://socialrunners.es/images/social-runners-share.png"
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Social Runners Valencia | Community Runs" />
    <meta
      name="twitter:description"
      content="Social Runners Valencia — an easy-paced running community in Valencia, Spain. Join our regular group runs and meet other runners through our Meetup group."
    />
    <meta
      name="twitter:image"
      content="https://socialrunners.es/images/social-runners-share.png"
    />

    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="nav-wrap">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="#intro" data-i18n="nav.brand"></a>

        <button
          class="nav-toggle"
          type="button"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
        </button>

        <div class="nav-right">
          <div class="nav-links">
            <a href="#intro" data-i18n="nav.home"></a>
            <a href="#about" data-i18n="nav.about"></a>
            <a href="#runs" data-i18n="nav.runs"></a>
            <a
              href="https://www.meetup.com/valencia-social-runners/"
              target="_blank"
              rel="noopener"
              class="nav-signup"
              data-i18n="nav.signup"
            ></a>
          </div>

          <div class="lang-toggle" aria-label="Language selector">
            <button type="button" data-lang="es" class="lang-btn">ES</button>
            <span class="lang-separator">/</span>
            <button type="button" data-lang="en" class="lang-btn active">EN</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="page">
      <section id="intro" class="hero" aria-labelledby="hero-title">
        <header class="hero-content">
          <h1 id="hero-title" data-i18n="hero.title"></h1>
          <p data-i18n="hero.body"></p>
        </header>
      </section>

      <div class="hero-illustration">
        <a
          href="https://www.meetup.com/valencia-social-runners/"
          target="_blank"
          rel="noopener"
        >
          <img
            src="images/social-runners-share.png"
            alt="Social Runners community running together at sunset in Valencia"
          />
        </a>
      </div>

      <section id="about" aria-labelledby="about-title">
        <header class="section-title">
          <h2 id="about-title" data-i18n="about.title"></h2>
          <p data-i18n="about.body"></p>
        </header>

        <div class="card-list">
          <article class="card">
            <h3 data-i18n="about.who.title"></h3>
            <p data-i18n="about.who.body"></p>
          </article>

          <article class="card">
            <h3 data-i18n="about.expect.title"></h3>
            <p data-i18n="about.expect.body"></p>
          </article>
        </div>

        <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>
      </section>

      <section id="runs" aria-labelledby="runs-title">
        <header class="section-title">
          <h2 id="runs-title" data-i18n="runs.title"></h2>
          <p data-i18n="runs.body"></p>
        </header>

        <div class="card-list">
          <article class="card runs-card">
            <h3 data-i18n="runs.how.title"></h3>

            <ol class="run-steps">
              <li>
                <span data-i18n="runs.steps.join.prefix"></span>
                <a
                  href="https://www.meetup.com/valencia-social-runners/"
                  target="_blank"
                  rel="noopener"
                  data-i18n="runs.steps.join.name"
                ></a>
                <span data-i18n="runs.steps.join.suffix"></span>
              </li>
              <li data-i18n="runs.steps.rsvp"></li>
              <li data-i18n="runs.steps.meet"></li>
            </ol>

            <p class="run-cta">
              <a
                href="https://www.meetup.com/valencia-social-runners/"
                target="_blank"
                rel="noopener"
                data-i18n="runs.how.cta"
              ></a>
            </p>
          </article>
        </div>

        <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page footer-row">
        <span>
          <span data-i18n="footer.copy.prefix"></span>
          <span id="year"></span>
          <span data-i18n="footer.copy.suffix"></span>
        </span>
        <a class="to-top" href="#intro" data-i18n="footer.backToTop"></a>
      </div>
    </footer>

    <script src="locales/es.js"></script>
    <script src="locales/en.js"></script>
    <script src="script.js"></script>
  </body>
</html>
